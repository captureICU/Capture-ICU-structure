<svg xmlns="http://www.w3.org/2000/svg" width="960" height="750" viewBox="0 0 960 750">
  <rect width="960" height="750" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#000000">

    <text x="20" y="34" font-size="18" font-weight="600">Où vit quoi dans le dépôt</text>
    <text x="940" y="34" font-size="12" text-anchor="end"><tspan fill="#0b7a55" font-weight="600">en vert</tspan><tspan fill-opacity=".7"> = les tests</tspan></text>

    <!-- Étiquettes de gauche -->
    <g font-size="12" font-weight="600" fill-opacity=".55">
      <text x="20" y="114">UI</text>
      <text x="20" y="250">CORE</text>
      <text x="20" y="396">TESTS DES</text>
      <text x="20" y="411">MODULES</text>
      <text x="20" y="514">MODULES</text>
      <text x="20" y="636">OUTILS</text>
    </g>

    <!-- UI -->
    <rect x="280" y="74" width="400" height="60" fill="none" stroke="#000000"/>
    <text x="480" y="99" font-size="15" font-weight="600" text-anchor="middle">UI · <tspan font-family="Menlo, Consolas, monospace" font-weight="400">App/Ecrans/</tspan></text>
    <text x="480" y="120" font-size="12" fill-opacity=".7" text-anchor="middle">les écrans iPhone (pas encore de tests : compilés dans Xcode)</text>
    <line x1="480" y1="134" x2="480" y2="182" stroke="#000000" marker-end="url(#a)"/>

    <!-- Cadre bout en bout -->
    <rect x="130" y="160" width="700" height="425" fill="none" stroke="#0b7a55" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="818" y="574" font-size="12" text-anchor="end" fill="#0b7a55"><tspan font-weight="600">✓ BoutEnBout/</tspan> — test bout en bout : tout ce cadre, avec les vrais modules</text>

    <!-- CORE -->
    <rect x="150" y="185" width="660" height="150" fill="none" stroke="#000000" stroke-width="2"/>
    <text x="170" y="212" font-size="15" font-weight="600">CORE · <tspan font-family="Menlo, Consolas, monospace" font-weight="400">Core/Code/</tspan></text>
    <text x="170" y="236" font-size="12" fill-opacity=".75"><tspan font-family="Menlo, Consolas, monospace">Tuyau/</tspan> — le parcours : connexion → photos → note → validation</text>
    <text x="170" y="256" font-size="12" fill-opacity=".75"><tspan font-family="Menlo, Consolas, monospace">Modeles/</tspan> — le dossier patient</text>

    <rect x="600" y="196" width="196" height="46" fill="#e6f4ee" stroke="#0b7a55"/>
    <text x="612" y="216" font-size="13" font-weight="600" fill="#0b7a55">✓ <tspan font-family="Menlo, Consolas, monospace">Core/Tests/</tspan></text>
    <text x="612" y="233" font-size="11" fill="#0b7a55">le Core seul, avec de faux modules</text>

    <!-- Prises -->
    <text x="170" y="282" font-size="11" fill-opacity=".6"><tspan font-family="Menlo, Consolas, monospace">Prises/</tspan> — là où chaque module se branche</text>
    <g font-size="13" text-anchor="middle">
      <rect x="175" y="292" width="150" height="34" fill="#f2f2f2" stroke="#000000"/><text x="250" y="314">prise OCR</text>
      <rect x="405" y="292" width="150" height="34" fill="#f2f2f2" stroke="#000000"/><text x="480" y="314">prise audio</text>
      <rect x="635" y="292" width="150" height="34" fill="#f2f2f2" stroke="#000000"/><text x="710" y="314">prise export</text>
    </g>

    <!-- Liens prise → test → module -->
    <g stroke="#000000">
      <line x1="250" y1="326" x2="250" y2="368"/><line x1="480" y1="326" x2="480" y2="368"/><line x1="710" y1="326" x2="710" y2="368"/>
      <line x1="250" y1="438" x2="250" y2="478"/><line x1="480" y1="438" x2="480" y2="478"/><line x1="710" y1="438" x2="710" y2="478"/>
    </g>

    <!-- Tests des modules (entre le Core et les modules) -->
    <g text-anchor="middle">
      <rect x="150" y="368" width="200" height="70" fill="#e6f4ee" stroke="#0b7a55" stroke-width="2"/>
      <text x="250" y="391" font-size="13" font-weight="600" fill="#0b7a55">✓ <tspan font-family="Menlo, Consolas, monospace">Modules/OCR/Tests/</tspan></text>
      <text x="250" y="410" font-size="11" fill="#0b7a55">le module respecte la prise</text>
      <text x="250" y="426" font-size="11" fill="#0b7a55" font-family="Menlo, Consolas, monospace">VerifierPrise.ocr(...)</text>

      <rect x="365" y="368" width="230" height="70" fill="#e6f4ee" stroke="#0b7a55" stroke-width="2"/>
      <text x="480" y="391" font-size="13" font-weight="600" fill="#0b7a55">✓ <tspan font-family="Menlo, Consolas, monospace">…/Transcription/Tests/</tspan></text>
      <text x="480" y="410" font-size="11" fill="#0b7a55">le module respecte la prise</text>
      <text x="480" y="426" font-size="11" fill="#0b7a55" font-family="Menlo, Consolas, monospace">VerifierPrise.transcription(...)</text>

      <rect x="610" y="368" width="200" height="70" fill="#e6f4ee" stroke="#0b7a55" stroke-width="2"/>
      <text x="710" y="391" font-size="13" font-weight="600" fill="#0b7a55">✓ <tspan font-family="Menlo, Consolas, monospace">Modules/Export/Tests/</tspan></text>
      <text x="710" y="410" font-size="11" fill="#0b7a55">le module respecte la prise</text>
      <text x="710" y="426" font-size="11" fill="#0b7a55" font-family="Menlo, Consolas, monospace">VerifierPrise.export(...)</text>
    </g>

    <!-- Modules -->
    <g text-anchor="middle">
      <rect x="150" y="478" width="200" height="66" fill="none" stroke="#000000"/>
      <text x="250" y="503" font-size="13" font-family="Menlo, Consolas, monospace">Modules/OCR/Code/</text>
      <text x="250" y="525" font-size="12" fill-opacity=".7">photo → valeurs</text>

      <rect x="365" y="478" width="230" height="66" fill="none" stroke="#000000"/>
      <text x="480" y="503" font-size="13" font-family="Menlo, Consolas, monospace">Modules/Transcription/Code/</text>
      <text x="480" y="525" font-size="12" fill-opacity=".7">audio → texte de la note</text>

      <rect x="610" y="478" width="200" height="66" fill="none" stroke="#000000"/>
      <text x="710" y="503" font-size="13" font-family="Menlo, Consolas, monospace">Modules/Export/Code/</text>
      <text x="710" y="525" font-size="12" fill-opacity=".7">dossier validé → PDF</text>
    </g>

    <!-- Outils de test -->
    <rect x="150" y="605" width="660" height="56" fill="none" stroke="#000000" stroke-dasharray="5 4"/>
    <text x="170" y="628" font-size="13" font-family="Menlo, Consolas, monospace">OutilsDeTest/</text>
    <text x="170" y="648" font-size="12" fill-opacity=".7">faux modules (pour Core/Tests) + VerifierPrise (pour les tests des modules)</text>

    <!-- Commandes -->
    <line x1="20" y1="684" x2="940" y2="684" stroke="#000000" stroke-opacity=".25"/>
    <text x="20" y="712" font-size="12" font-family="Menlo, Consolas, monospace">bash scripts/tester.sh ocr</text>
    <text x="232" y="712" font-size="12" fill-opacity=".7">→ un seul module</text>
    <text x="500" y="712" font-size="12" font-family="Menlo, Consolas, monospace">bash scripts/verifier.sh</text>
    <text x="700" y="712" font-size="12" fill-opacity=".7">→ tout, avant une pull request</text>
  </g>
</svg>
