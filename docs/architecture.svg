<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610">
    <rect width="960" height="610" fill="#ffffff"/>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
      </marker>
    </defs>
    <g font-family="Helvetica, Arial, sans-serif" fill="#000000" text-anchor="middle">

      <!-- App -->
      <rect x="20" y="20" width="920" height="74" fill="none" stroke="#000000"/>
      <text x="40" y="44" font-size="15" font-weight="600" text-anchor="start">App iPhone</text>
      <text x="920" y="44" font-size="12" text-anchor="end" fill-opacity=".6">ce que l'infirmière voit et touche</text>
      <g font-size="13">
        <rect x="40" y="54" width="208" height="28" fill="none" stroke="#000000"/><text x="144" y="73">Connexion</text>
        <rect x="264" y="54" width="208" height="28" fill="none" stroke="#000000"/><text x="368" y="73">Choix du patient</text>
        <rect x="488" y="54" width="208" height="28" fill="none" stroke="#000000"/><text x="592" y="73">Photo / micro</text>
        <rect x="712" y="54" width="208" height="28" fill="none" stroke="#000000"/><text x="816" y="73">Validation</text>
      </g>

      <!-- Core -->
      <rect x="20" y="114" width="920" height="250" fill="none" stroke="#000000" stroke-width="2"/>
      <text x="40" y="140" font-size="16" font-weight="600" text-anchor="start" fill="#000000">CORE · le tuyau central</text>
      <text x="920" y="140" font-size="12" text-anchor="end" fill-opacity=".6">Thomas</text>

      <g font-size="13">
        <rect x="40" y="156" width="260" height="84" fill="none" stroke="#000000"/>
        <text x="170" y="180" font-weight="600">Séquence de capture</text>
        <text x="170" y="201" font-size="12" fill-opacity=".75">moniteur → pompes → ventilateur</text>
        <text x="170" y="219" font-size="12" fill-opacity=".75">(nombre de pompes variable)</text>

        <line x1="300" y1="198" x2="346" y2="198" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>

        <rect x="350" y="156" width="260" height="84" fill="none" stroke="#000000"/>
        <text x="480" y="180" font-weight="600">Dossier patient</text>
        <text x="480" y="201" font-size="12" fill-opacity=".75">code patient</text>
        <text x="480" y="219" font-size="12" fill-opacity=".75">valeurs par système + note vocale</text>

        <line x1="610" y1="198" x2="656" y2="198" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>

        <rect x="660" y="156" width="260" height="84" fill="none" stroke="#000000"/>
        <text x="790" y="180" font-weight="600">Validation</text>
        <text x="790" y="201" font-size="12" fill-opacity=".75">hors plage → rouge · doute → vide</text>
        <text x="790" y="219" font-size="12" fill-opacity=".75">l'infirmière confirme tout</text>
      </g>

      <rect x="40" y="254" width="880" height="32" fill="none" stroke="#000000" stroke-dasharray="5 4"/>
      <text x="480" y="275" font-size="13"><tspan font-weight="600">Sécurité, pour tous :</tspan> connexion · rien gardé sur le téléphone · une personne à la fois</text>

      <!-- Prises -->
      <g font-size="12" font-weight="600" fill="#000000">
        <rect x="90" y="312" width="140" height="32" rx="16" fill="none" stroke="#000000" stroke-width="1.5"/><text x="160" y="333">prise OCR</text>
        <rect x="410" y="312" width="140" height="32" rx="16" fill="none" stroke="#000000" stroke-width="1.5"/><text x="480" y="333">prise audio</text>
        <rect x="730" y="312" width="140" height="32" rx="16" fill="none" stroke="#000000" stroke-width="1.5"/><text x="800" y="333">prise export</text>
      </g>

      <!-- Connexions modules ↔ core -->
      <line x1="160" y1="406" x2="160" y2="348" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
      <text x="172" y="384" font-size="12" text-anchor="start" fill-opacity=".7">valeurs</text>
      <line x1="480" y1="406" x2="480" y2="348" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
      <text x="492" y="384" font-size="12" text-anchor="start" fill-opacity=".7">texte</text>
      <line x1="800" y1="344" x2="800" y2="402" stroke="#000000" stroke-width="1.5" marker-end="url(#a)"/>
      <text x="812" y="384" font-size="12" text-anchor="start" fill-opacity=".7">dossier validé</text>

      <!-- Modules -->
      <g font-size="13">
        <rect x="20" y="406" width="280" height="104" fill="none" stroke="#000000" stroke-width="1.5"/>
        <text x="160" y="434" font-size="15" font-weight="600">Module 1 · OCR</text>
        <text x="160" y="460">photo → valeurs</text>
        <text x="160" y="480" font-size="12" fill-opacity=".7">placées dans les bons champs</text>

        <rect x="340" y="406" width="280" height="104" fill="none" stroke="#000000" stroke-width="1.5"/>
        <text x="480" y="434" font-size="15" font-weight="600">Module 2 · Transcription</text>
        <text x="480" y="460">audio → texte</text>
        <text x="480" y="480" font-size="12" fill-opacity=".7">note gardée telle quelle</text>

        <rect x="660" y="406" width="280" height="104" fill="none" stroke="#000000" stroke-width="1.5"/>
        <text x="800" y="434" font-size="15" font-weight="600">Module 3 · Données &amp; export</text>
        <text x="800" y="460">dossier → note infirmière PDF</text>
        <text x="800" y="480" font-size="12" fill-opacity=".7">formulaire ICM211 · Criticare plus tard</text>
      </g>

      <!-- Tests -->
      <rect x="20" y="540" width="920" height="50" fill="none" stroke="#000000"/>
      <text x="480" y="570" font-size="13"><tspan font-weight="600">Tests :</tspan> chaque module se teste seul avec des faux modules à la place des autres · CI à chaque PR</text>
    </g>
  </svg>
